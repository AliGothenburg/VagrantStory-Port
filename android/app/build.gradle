plugins {
    id 'com.android.application'
}

def sdlSource = project.findProperty('vsport.sdl') ?: ''

android {
    namespace 'io.github.aligothenburg.vagrantstory'
    compileSdk 36
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'io.github.aligothenburg.vagrantstory'
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName '0.3.2'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DVSPORT_LINK_AOT=OFF', "-DVSPORT_SDL_SOURCE_DIR=${sdlSource}"
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs as is (personal use, not a store build)
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
    }
}